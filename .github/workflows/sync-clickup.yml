name: Sincronizar com ClickUp

on:
  schedule:
    # De 30 em 30 min, das 06:00 às 22:00 no horário de Brasília (UTC-3).
    # O cron do GitHub roda em UTC: 06:00 BRT = 09:00 UTC ... 22:00 BRT = 01:00 UTC (dia seguinte).
    # Obs.: o GitHub pode atrasar/pular execuções agendadas em repositórios de pouco tráfego.
    - cron: '0,30 9-23 * * *'   # 06:00 -> 20:30 BRT
    - cron: '0,30 0 * * *'      # 21:00 e 21:30 BRT
    - cron: '0 1 * * *'         # 22:00 BRT
  workflow_dispatch: {}   # permite rodar manualmente pelo painel do GitHub

# Evita duas sincronizações ao mesmo tempo (disputa no git push)
concurrency:
  group: sync-clickup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar dados do ClickUp
        id: sync
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: python3 automation/sync_clickup.py

      - name: Reconstruir index.html
        run: |
          node automation/build.js
          cp publish_out/index.html index.html

      - name: Commit e push (se algo mudou)
        run: |
          git config user.name "ClickUp Sync Bot"
          git config user.email "actions@github.com"
          git add index.html automation/rafael.json automation/tiago.json automation/roadmap.json automation/last_sync.json automation/sync_errors.log
          git diff --cached --quiet && echo "Nada para commitar" || git commit -m "Sincronização automática com ClickUp"
          git pull --rebase origin main || true
          git push
